<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" role="img" aria-labelledby="map-title map-desc"><title id="map-title">Where the nearest Shrine of Stendarr is</title><desc id="map-desc">A north-up plot of Helgen, Riverwood, Whiterun, Rorikstead, Falkreath and Bleak Falls Barrow, with The Two Pillars shrine marked 23 cells from Helgen. Edge labels give the distance to the Hall of the Vigilant, Fort Greenwall, Stendarr's Beacon and the Solitude temple.</desc><!-- original, Fellowship, 2026: plotted from game location data, no game art -->
